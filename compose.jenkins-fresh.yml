networks:
  fitpulse-ci:
    name: fitpulse-ci

services:
  jenkins-controller:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins-controller
    networks:
      - fitpulse-ci
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_controller_home:/var/jenkins_home

  sonarqube:
    image: sonarqube:lts
    container_name: sonarqube
    networks:
      - fitpulse-ci
    ports:
      - "9000:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=false
    volumes:
      - sonarqube_data:/opt/sonarqube/data

  nexus:
    image: sonatype/nexus3
    container_name: nexus
    networks:
      - fitpulse-ci
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data

volumes:
  jenkins_controller_home:
  sonarqube_data:
  nexus_data:
