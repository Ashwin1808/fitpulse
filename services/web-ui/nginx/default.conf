limit_req_zone $binary_remote_addr zone=fitpulse_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=fitpulse_conn:10m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Request-Id $request_id always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'" always;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /api/products {
        limit_req zone=fitpulse_api burst=60 nodelay;
        limit_conn fitpulse_conn 50;
        proxy_pass http://commerce-node-service:3000;
    }

    location ^~ /api/orders {
        limit_req zone=fitpulse_api burst=60 nodelay;
        limit_conn fitpulse_conn 50;
        proxy_pass http://commerce-node-service:3000;
    }

    location ^~ /api/foods {
        limit_req zone=fitpulse_api burst=60 nodelay;
        limit_conn fitpulse_conn 50;
        proxy_pass http://tracking-java-service:8080;
    }

    location ^~ /api/calories {
        limit_req zone=fitpulse_api burst=60 nodelay;
        limit_conn fitpulse_conn 50;
        proxy_pass http://tracking-java-service:8080;
    }

    location ^~ /api/track {
        limit_req zone=fitpulse_api burst=60 nodelay;
        limit_conn fitpulse_conn 50;
        proxy_pass http://tracking-java-service:8080;
    }

    location ^~ /api/worker {
        limit_req zone=fitpulse_api burst=60 nodelay;
        limit_conn fitpulse_conn 50;
        proxy_pass http://worker-python-service:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
