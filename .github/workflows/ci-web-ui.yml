name: CI - Web UI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
    paths:
      - "services/web-ui/**"
      - ".github/workflows/ci-web-ui.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "services/web-ui/**"
      - ".github/workflows/ci-web-ui.yml"

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/web-ui/package-lock.json

      - name: Install, typecheck, and build web-ui
        run: |
          npm --prefix services/web-ui ci --no-audit --no-fund
          npm --prefix services/web-ui run typecheck
          npm --prefix services/web-ui run build