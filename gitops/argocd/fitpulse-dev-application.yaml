apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitpulse-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ashwin1808/fitpulse.git
    targetRevision: feat/local-k8s
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: fitpulse-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true