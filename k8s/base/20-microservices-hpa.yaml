apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: commerce-node-service-hpa
  namespace: fitpulse-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: commerce-node-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75