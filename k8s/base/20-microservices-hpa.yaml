apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-node-service
  namespace: fitpulse-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-node-service
  template:
    metadata:
      labels:
        app: commerce-node-service
    spec:
      serviceAccountName: fitpulse-workload-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: commerce-node-service
          image: fitpulse/commerce-node-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: fitpulse-config
            - secretRef:
                name: fitpulse-db-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-node-service
  namespace: fitpulse-dev
spec:
  selector:
    app: commerce-node-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
